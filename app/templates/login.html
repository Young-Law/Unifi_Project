<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFi Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-white">

    <div class="bg-white shadow-2xl border border-gray-200 rounded-2xl p-10 w-full max-w-md">

        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8 tracking-wide">
            UniFi Login
        </h2>

        <form id="loginForm" method="POST" action="/auth/login-init" class="space-y-6">

            <div>
                <label class="block text-gray-700 font-medium mb-1">Username / Email</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition shadow-sm">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition shadow-sm">
            </div>

            <div class="flex items-center">
                <input type="checkbox" name="remember_me" id="remember_me" class="h-4 w-4 text-blue-600">
                <label for="remember_me" class="ml-2 text-gray-700 text-sm">Remember Me</label>
            </div>

            {% if error and error.body and error.body.code != "MFA_REQUIRED" %}
<div class="text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-center font-medium">
    {{ error.body.message if error.body.message else "Login failed" }}
</div>
{% endif %}


            <!-- Login Button with Spinner -->
            <button id="loginBtn" type="submit"
                class="w-full py-3 bg-blue-600 text-white rounded-xl font-semibold text-lg shadow-md hover:bg-blue-700 transition duration-300 flex items-center justify-center gap-2">
                <span id="loginText">Login</span>

                <!-- Hidden spinner -->
                <svg id="loginSpinner" class="hidden animate-spin h-5 w-5 text-white"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-30" cx="12" cy="12" r="10"
                        stroke="currentColor" stroke-width="4">
                    </circle>
                    <path class="opacity-80" fill="currentColor"
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                    </path>
                </svg>
            </button>

        </form>

    </div>

    <!-- Spinner Script (Safe Form Submit) -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function () {

            const btn = document.getElementById("loginBtn");
            const text = document.getElementById("loginText");
            const spinner = document.getElementById("loginSpinner");

            text.classList.add("hidden");
            spinner.classList.remove("hidden");

            btn.disabled = true;
            btn.classList.add("opacity-70", "cursor-not-allowed");
        });
    </script>

</body>

</html>
