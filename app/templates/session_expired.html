<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-white">

    <div class="bg-white shadow-2xl border border-gray-200 rounded-2xl p-10 w-full max-w-md text-center">

        <h2 class="text-3xl font-bold text-gray-800 mb-4 tracking-wide">
            Session Expired
        </h2>

        <p class="text-gray-600 mb-6">
            Your UniFi session has expired. Please sign in again.
        </p>

        <a href="/login"
            class="w-full inline-block py-3 bg-blue-600 text-white rounded-xl font-semibold text-lg shadow-md hover:bg-blue-700 transition duration-300">
            Sign In
        </a>

    </div>

</body>

</html>
